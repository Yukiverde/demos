```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Pong</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      width: 90vw;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    .instructions {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: black;
      border: 2px solid white;
    }

    .score {
      display: flex;
      justify-content: space-around;
      font-size: 32px;
      margin-top: 15px;
    }

    #mode {
      margin-top: 10px;
      color: #aaa;
    }

    #message {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="game-container">

    <h1>Classic Pong</h1>

    <div class="instructions">
      W / S = Move &nbsp; | &nbsp;
      1 = Classic Mode &nbsp; | &nbsp;
      2 = Fast Mode &nbsp; | &nbsp;
      Space = Restart
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div class="score">
      <span id="playerScore">0</span>
      <span id="aiScore">0</span>
    </div>

    <div id="mode">Mode: Classic</div>

    <div id="message"></div>

  </div>


  <script>

    // Get the canvas
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Get HTML elements
    const playerScoreElement = document.getElementById("playerScore");
    const aiScoreElement = document.getElementById("aiScore");
    const messageElement = document.getElementById("message");
    const modeElement = document.getElementById("mode");


    // -------------------------
    // Game settings
    // -------------------------

    const paddleWidth = 12;
    const paddleHeight = 100;

    const winningScore = 5;

    // Different speeds for each mode
    const modes = {
      classic: {
        ballSpeed: 5,
        aiSpeed: 5
      },

      fast: {
        ballSpeed: 8,
        aiSpeed: 8
      }
    };

    let currentMode = "classic";

    let gameOver = false;


    // -------------------------
    // Player
    // -------------------------

    const player = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 8,
      score: 0
    };


    // -------------------------
    // AI
    // -------------------------

    const ai = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0
    };


    // -------------------------
    // Ball
    // -------------------------

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 12,
      speedX: 5,
      speedY: 3
    };


    // Keyboard controls
    const keys = {
      w: false,
      s: false
    };


    // -------------------------
    // Keyboard input
    // -------------------------

    document.addEventListener("keydown", function(event) {

      const key = event.key.toLowerCase();

      if (key === "w") {
        keys.w = true;
      }

      if (key === "s") {
        keys.s = true;
      }


      // Classic Mode
      if (key === "1") {
        changeMode("classic");
      }


      // Fast Mode
      if (key === "2") {
        changeMode("fast");
      }


      // Restart
      if (event.code === "Space") {

        // Prevent the page from scrolling
        event.preventDefault();

        if (gameOver) {
          restartGame();
        }
      }

    });


    document.addEventListener("keyup", function(event) {

      const key = event.key.toLowerCase();

      if (key === "w") {
        keys.w = false;
      }

      if (key === "s") {
        keys.s = false;
      }

    });


    // -------------------------
    // Change game mode
    // -------------------------

    function changeMode(mode) {

      currentMode = mode;

      if (mode === "classic") {
        modeElement.textContent = "Mode: Classic";
      }

      if (mode === "fast") {
        modeElement.textContent = "Mode: FAST 🔥";
      }

      // Starting a new game when changing mode
      restartGame();
    }


    // -------------------------
    // Move player
    // -------------------------

    function movePlayer() {

      if (keys.w) {
        player.y -= player.speed;
      }

      if (keys.s) {
        player.y += player.speed;
      }


      // Keep player inside screen
      if (player.y < 0) {
        player.y = 0;
      }

      if (player.y + player.height > canvas.height) {
        player.y = canvas.height - player.height;
      }

    }


    // -------------------------
    // Move AI
    // -------------------------

    function moveAI() {

      const aiSpeed = modes[currentMode].aiSpeed;

      const paddleCenter = ai.y + ai.height / 2;


      // AI follows the ball
      if (paddleCenter < ball.y) {
        ai.y += aiSpeed;
      }

      if (paddleCenter > ball.y) {
        ai.y -= aiSpeed;
      }


      // Keep AI inside screen
      if (ai.y < 0) {
        ai.y = 0;
      }

      if (ai.y + ai.height > canvas.height) {
        ai.y = canvas.height - ai.height;
      }

    }


    // -------------------------
    // Move ball
    // -------------------------

    function moveBall() {

      ball.x += ball.speedX;
      ball.y += ball.speedY;


      // Top wall
      if (ball.y <= 0) {
        ball.y = 0;
        ball.speedY *= -1;
      }


      // Bottom wall
      if (ball.y + ball.size >= canvas.height) {
        ball.y = canvas.height - ball.size;
        ball.speedY *= -1;
      }


      // -------------------------
      // Player collision
      // -------------------------

      if (
        ball.x <= player.x + player.width &&
        ball.x + ball.size >= player.x &&
        ball.y + ball.size >= player.y &&
        ball.y <= player.y + player.height
      ) {

        ball.x = player.x + player.width;

        ball.speedX *= -1;

        increaseBallSpeed();

      }


      // -------------------------
      // AI collision
      // -------------------------

      if (
        ball.x + ball.size >= ai.x &&
        ball.x <= ai.x + ai.width &&
        ball.y + ball.size >= ai.y &&
        ball.y <= ai.y + ai.height
      ) {

        ball.x = ai.x - ball.size;

        ball.speedX *= -1;

        increaseBallSpeed();

      }


      // -------------------------
      // AI scores
      // -------------------------

      if (ball.x < 0) {

        ai.score++;

        updateScore();

        checkWinner();

        if (!gameOver) {
          resetBall();
        }

      }


      // -------------------------
      // Player scores
      // -------------------------

      if (ball.x > canvas.width) {

        player.score++;

        updateScore();

        checkWinner();

        if (!gameOver) {
          resetBall();
        }

      }

    }


    // -------------------------
    // Make ball faster
    // -------------------------

    function increaseBallSpeed() {

      // Fast mode becomes even faster
      if (currentMode === "fast") {

        // Increase horizontal speed slightly
        if (ball.speedX > 0) {
          ball.speedX += 0.3;
        } else {
          ball.speedX -= 0.3;
        }

        // Increase vertical speed slightly
        if (ball.speedY > 0) {
          ball.speedY += 0.15;
        } else {
          ball.speedY -= 0.15;
        }

      }

    }


    // -------------------------
    // Reset ball
    // -------------------------

    function resetBall() {

      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const baseSpeed = modes[currentMode].ballSpeed;

      // Random direction
      ball.speedX = Math.random() > 0.5
        ? baseSpeed
        : -baseSpeed;

      ball.speedY = Math.random() > 0.5
        ? baseSpeed * 0.6
        : -baseSpeed * 0.6;

    }


    // -------------------------
    // Update score
    // -------------------------

    function updateScore() {

      playerScoreElement.textContent = player.score;
      aiScoreElement.textContent = ai.score;

    }


    // -------------------------
    // Check winner
    // -------------------------

    function checkWinner() {

      if (player.score >= winningScore) {

        gameOver = true;

        messageElement.textContent =
          "You Win! Press Space to Restart";

      }


      if (ai.score >= winningScore) {

        gameOver = true;

        messageElement.textContent =
          "You Lose! Press Space to Restart";

      }

    }


    // -------------------------
    // Restart game
    // -------------------------

    function restartGame() {

      player.score = 0;
      ai.score = 0;

      player.y =
        canvas.height / 2 - paddleHeight / 2;

      ai.y =
        canvas.height / 2 - paddleHeight / 2;

      gameOver = false;

      messageElement.textContent = "";

      updateScore();

      resetBall();

    }


    // -------------------------
    // Draw game
    // -------------------------

    function draw() {

      // Clear screen
      ctx.fillStyle = "#000";
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // Center line
      ctx.setLineDash([10, 10]);

      ctx.strokeStyle = "#555";

      ctx.beginPath();

      ctx.moveTo(
        canvas.width / 2,
        0
      );

      ctx.lineTo(
        canvas.width / 2,
        canvas.height
      );

      ctx.stroke();

      ctx.setLineDash([]);


      // Draw player
      ctx.fillStyle = "#fff";

      ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
      );


      // Draw AI
      ctx.fillRect(
        ai.x,
        ai.y,
        ai.width,
        ai.height
      );


      // Draw ball
      ctx.fillRect(
        ball.x,
        ball.y,
        ball.size,
        ball.size
      );

    }


    // -------------------------
    // Main game loop
    // -------------------------

    function gameLoop() {

      if (!gameOver) {

        movePlayer();

        moveAI();

        moveBall();

      }

      draw();

      requestAnimationFrame(gameLoop);

    }


    // Start game
    updateScore();

    resetBall();

    gameLoop();

  </script>

</body>
</html>
