<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Extreme Pong</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
    }

    .game-container {
      width: 92vw;
      max-width: 1000px;
      text-align: center;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .instructions {
      color: #888;
      font-size: 14px;
      margin-bottom: 15px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;

      background: #000;

      border: 2px solid white;
    }

    .score {
      display: flex;
      justify-content: space-around;

      font-size: 36px;
      font-weight: bold;

      margin-top: 12px;
    }

    #difficulty {
      margin-top: 5px;
      color: #aaa;
      font-size: 14px;
    }

    #message {
      margin-top: 12px;

      font-size: 22px;
      font-weight: bold;

      min-height: 28px;
    }
  </style>
</head>

<body>

  <div class="game-container">

    <h1>EXTREME PONG</h1>

    <div class="instructions">
      W / S = Move &nbsp; | &nbsp; Space = Restart
    </div>

    <canvas
      id="gameCanvas"
      width="1000"
      height="550">
    </canvas>

    <div class="score">
      <span id="playerScore">0</span>
      <span id="aiScore">0</span>
    </div>

    <div id="difficulty">
      ⚡ EXTREME FAST MODE
    </div>

    <div id="message"></div>

  </div>


  <script>

    // =========================================
    // CANVAS
    // =========================================

    const canvas = document.getElementById("gameCanvas");

    const ctx = canvas.getContext("2d");


    // =========================================
    // HTML ELEMENTS
    // =========================================

    const playerScoreElement =
      document.getElementById("playerScore");

    const aiScoreElement =
      document.getElementById("aiScore");

    const messageElement =
      document.getElementById("message");


    // =========================================
    // GAME SETTINGS
    // =========================================

    const winningScore = 5;

    const paddleWidth = 12;

    // Smaller paddles = harder game
    const paddleHeight = 75;

    const playerSpeed = 11;

    // Very fast AI
    const aiSpeed = 10;


    // =========================================
    // PLAYER
    // =========================================

    const player = {

      x: 25,

      y: canvas.height / 2 - paddleHeight / 2,

      width: paddleWidth,

      height: paddleHeight,

      score: 0
    };


    // =========================================
    // AI
    // =========================================

    const ai = {

      x: canvas.width - 25 - paddleWidth,

      y: canvas.height / 2 - paddleHeight / 2,

      width: paddleWidth,

      height: paddleHeight,

      score: 0
    };


    // =========================================
    // BALL
    // =========================================

    const ball = {

      x: canvas.width / 2,

      y: canvas.height / 2,

      size: 14,

      // Starting speed
      speedX: 10,

      speedY: 5,

      // Used for the glowing trail
      trail: []
    };


    // =========================================
    // GAME STATE
    // =========================================

    let gameOver = false;

    let rallyCount = 0;


    // Keyboard state
    const keys = {

      w: false,

      s: false
    };


    // =========================================
    // KEYBOARD CONTROLS
    // =========================================

    document.addEventListener("keydown", function(event) {

      const key = event.key.toLowerCase();


      if (key === "w") {
        keys.w = true;
      }


      if (key === "s") {
        keys.s = true;
      }


      // Restart game
      if (event.code === "Space") {

        event.preventDefault();

        if (gameOver) {

          restartGame();

        }

      }

    });


    document.addEventListener("keyup", function(event) {

      const key = event.key.toLowerCase();


      if (key === "w") {
        keys.w = false;
      }


      if (key === "s") {
        keys.s = false;
      }

    });


    // =========================================
    // MOVE PLAYER
    // =========================================

    function movePlayer() {

      if (keys.w) {

        player.y -= playerSpeed;

      }


      if (keys.s) {

        player.y += playerSpeed;

      }


      // Keep player inside the screen

      if (player.y < 0) {

        player.y = 0;

      }


      if (player.y + player.height > canvas.height) {

        player.y =
          canvas.height - player.height;

      }

    }


    // =========================================
    // MOVE AI
    // =========================================

    function moveAI() {

      const paddleCenter =
        ai.y + ai.height / 2;


      // AI follows the ball

      if (paddleCenter < ball.y) {

        ai.y += aiSpeed;

      }


      if (paddleCenter > ball.y) {

        ai.y -= aiSpeed;

      }


      // Keep AI inside screen

      if (ai.y < 0) {

        ai.y = 0;

      }


      if (ai.y + ai.height > canvas.height) {

        ai.y =
          canvas.height - ai.height;

      }

    }


    // =========================================
    // MOVE BALL
    // =========================================

    function moveBall() {

      ball.x += ball.speedX;

      ball.y += ball.speedY;


      // Save ball position for the trail

      ball.trail.push({

        x: ball.x,

        y: ball.y

      });


      // Only keep the last 10 positions

      if (ball.trail.length > 10) {

        ball.trail.shift();

      }


      // =====================================
      // TOP WALL
      // =====================================

      if (ball.y <= 0) {

        ball.y = 0;

        ball.speedY *= -1;

      }


      // =====================================
      // BOTTOM WALL
      // =====================================

      if (ball.y + ball.size >= canvas.height) {

        ball.y =
          canvas.height - ball.size;

        ball.speedY *= -1;

      }


      // =====================================
      // PLAYER COLLISION
      // =====================================

      if (

        ball.x <= player.x + player.width &&

        ball.x + ball.size >= player.x &&

        ball.y + ball.size >= player.y &&

        ball.y <= player.y + player.height

      ) {

        ball.x =
          player.x + player.width;


        // Reverse direction

        ball.speedX *= -1;


        // Change vertical direction
        // depending on where the ball hits

        addSpin(player);


        // Make the ball faster

        increaseSpeed();


        rallyCount++;

      }


      // =====================================
      // AI COLLISION
      // =====================================

      if (

        ball.x + ball.size >= ai.x &&

        ball.x <= ai.x + ai.width &&

        ball.y + ball.size >= ai.y &&

        ball.y <= ai.y + ai.height

      ) {

        ball.x =
          ai.x - ball.size;


        // Reverse direction

        ball.speedX *= -1;


        // Add spin

        addSpin(ai);


        // Increase speed

        increaseSpeed();


        rallyCount++;

      }


      // =====================================
      // AI SCORES
      // =====================================

      if (ball.x < 0) {

        ai.score++;

        updateScore();

        checkWinner();


        if (!gameOver) {

          resetBall();

        }

      }


      // =====================================
      // PLAYER SCORES
      // =====================================

      if (ball.x > canvas.width) {

        player.score++;

        updateScore();

        checkWinner();


        if (!gameOver) {

          resetBall();

        }

      }

    }


    // =========================================
    // ADD BALL SPIN
    // =========================================

    function addSpin(paddle) {

      // Find where the ball hit the paddle

      const paddleCenter =
        paddle.y + paddle.height / 2;

      const ballCenter =
        ball.y + ball.size / 2;


      const hitPosition =
        ballCenter - paddleCenter;


      // Convert hit position into a
      // value between roughly -1 and 1

      const normalizedHit =
        hitPosition / (paddle.height / 2);


      // Add vertical movement based
      // on where the paddle was hit

      ball.speedY += normalizedHit * 2;


      // Prevent the ball from becoming
      // too vertical

      if (Math.abs(ball.speedY) < 2) {

        ball.speedY =
          ball.speedY >= 0 ? 2 : -2;

      }

    }


    // =========================================
    // INCREASE BALL SPEED
    // =========================================

    function increaseSpeed() {

      // Make the ball faster after every hit

      if (ball.speedX > 0) {

        ball.speedX += 0.45;

      } else {

        ball.speedX -= 0.45;

      }


      // Also increase vertical speed

      if (ball.speedY > 0) {

        ball.speedY += 0.08;

      } else {

        ball.speedY -= 0.08;

      }


      // Prevent the ball from becoming
      // completely impossible

      const maxSpeed = 22;


      if (Math.abs(ball.speedX) > maxSpeed) {

        ball.speedX =
          ball.speedX > 0
            ? maxSpeed
            : -maxSpeed;

      }

    }


    // =========================================
    // RESET BALL
    // =========================================

    function resetBall() {

      ball.x =
        canvas.width / 2;

      ball.y =
        canvas.height / 2;


      // Reset rally counter

      rallyCount = 0;


      // Start fast

      ball.speedX =
        Math.random() > 0.5
          ? 10
          : -10;


      ball.speedY =
        Math.random() > 0.5
          ? 5
          : -5;


      // Clear trail

      ball.trail = [];

    }


    // =========================================
    // UPDATE SCORE
    // =========================================

    function updateScore() {

      playerScoreElement.textContent =
        player.score;

      aiScoreElement.textContent =
        ai.score;

    }


    // =========================================
    // CHECK WINNER
    // =========================================

    function checkWinner() {

      if (player.score >= winningScore) {

        gameOver = true;

        messageElement.textContent =
          "YOU WIN! 🔥 Press Space to Restart";

      }


      if (ai.score >= winningScore) {

        gameOver = true;

        messageElement.textContent =
          "YOU LOSE 💀 Press Space to Restart";

      }

    }


    // =========================================
    // RESTART
    // =========================================

    function restartGame() {

      player.score = 0;

      ai.score = 0;


      player.y =
        canvas.height / 2 -
        paddleHeight / 2;


      ai.y =
        canvas.height / 2 -
        paddleHeight / 2;


      gameOver = false;

      messageElement.textContent = "";


      updateScore();

      resetBall();

    }


    // =========================================
    // DRAW GAME
    // =========================================

    function draw() {

      // Clear screen

      ctx.fillStyle = "#000";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // =====================================
      // CENTER LINE
      // =====================================

      ctx.strokeStyle = "#333";

      ctx.setLineDash([10, 10]);

      ctx.beginPath();

      ctx.moveTo(
        canvas.width / 2,
        0
      );

      ctx.lineTo(
        canvas.width / 2,
        canvas.height
      );

      ctx.stroke();

      ctx.setLineDash([]);


      // =====================================
      // BALL TRAIL
      // =====================================

      for (let i = 0; i < ball.trail.length; i++) {

        const position =
          ball.trail[i];


        // Older trail positions are
        // more transparent

        const alpha =
          i / ball.trail.length;


        ctx.fillStyle =
          `rgba(255, 255, 255, ${alpha * 0.4})`;


        ctx.fillRect(

          position.x,

          position.y,

          ball.size,

          ball.size

        );

      }


      // =====================================
      // BALL GLOW
      // =====================================

      ctx.shadowBlur = 20;

      ctx.shadowColor = "white";

      ctx.fillStyle = "white";


      ctx.fillRect(

        ball.x,

        ball.y,

        ball.size,

        ball.size

      );


      // Turn off glow

      ctx.shadowBlur = 0;


      // =====================================
      // PLAYER PADDLE
      // =====================================

      ctx.fillStyle = "white";

      ctx.fillRect(

        player.x,

        player.y,

        player.width,

        player.height

      );


      // =====================================
      // AI PADDLE
      // =====================================

      ctx.fillRect(

        ai.x,

        ai.y,

        ai.width,

        ai.height

      );

    }


    // =========================================
    // MAIN GAME LOOP
    // =========================================

    function gameLoop() {

      if (!gameOver) {

        movePlayer();

        moveAI();

        moveBall();

      }


      draw();


      requestAnimationFrame(gameLoop);

    }


    // =========================================
    // START GAME
    // =========================================

    updateScore();

    resetBall();

    gameLoop();

  </script>

</body>
</html>
